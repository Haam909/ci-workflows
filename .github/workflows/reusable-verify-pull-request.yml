# Haam909/ci-workflows/.github/workflows/reusable-verify-pull-request.yml
#
# Reusable PR gate. Two cheap checks, no toolchains, no matrix: the tests
# themselves ran on the developer's machine before the push (see LOCAL-GATE.md).
# Nothing here deploys or publishes.

name: verify-pull-request

on:
  workflow_call:
    inputs:
      require-local-signoff:
        description: >-
          Require green local/ci commit statuses on the PR's head commit,
          posted by bin/signoff from developer machines.
        type: boolean
        default: true
      signoffs:
        description: >-
          How many different people must have signed the commit off. With 2
          or more, one of them must not be the PR's author: the reviewer
          pulled the branch, ran bin/ci and ran bin/signoff too.
        type: number
        default: 2
      signoff-context:
        type: string
        default: 'local/ci'

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The hook checked this before the push, but the base can move between a
      # push and a merge, so it is enforced here rather than just advised.
      - name: Branch must be current with its base
        env:
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${BASE}"
          if ! git merge-base --is-ancestor "origin/${BASE}" HEAD; then
            BEHIND=$(git rev-list --count "HEAD..origin/${BASE}")
            echo "::error::${BASE} has moved on by ${BEHIND} commit(s). Rebase, re-run bin/ci, and push again."
            exit 1
          fi
          echo "Current with ${BASE}."

      # Developer machines ran the checks; this confirms it happened for this
      # exact commit, and by enough different people. The author's signoff
      # comes from the pre-push hook; a reviewer's from pulling the branch and
      # running bin/ci and bin/signoff. A new commit has no signoffs.
      - name: Local checks must be signed off for this commit
        if: inputs.require-local-signoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: ${{ inputs.signoff-context }}
          NEED: ${{ inputs.signoffs }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          # Each person's latest status in this context, keeping the green ones.
          # Statuses come newest first.
          SIGNED="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses?per_page=100" \
                      --jq "[.[] | select(.context == \"${CTX}\")]
                            | group_by(.creator.login) | map(first)
                            | map(select(.state == \"success\") | .creator.login) | .[]")"
          COUNT="$(grep -c . <<< "${SIGNED}" || true)"
          OTHERS="$(grep -vxF "${AUTHOR}" <<< "${SIGNED}" || true)"
          echo "Green '${CTX}' on ${SHA:0:7} from: $(tr '\n' ' ' <<< "${SIGNED:-nobody}")"
          if (( COUNT < NEED )); then
            echo "::error::${COUNT} of ${NEED} required '${CTX}' signoffs on ${SHA:0:7}."
            if (( NEED >= 2 )) && grep -qxF "${AUTHOR}" <<< "${SIGNED}"; then
              echo "::error::A reviewer must pull this branch, run ./bin/ci, then ./bin/signoff ${SHA}"
            else
              echo "::error::Run ./bin/ci locally, then ./bin/signoff ${SHA}"
            fi
            exit 1
          fi
          if (( NEED >= 2 )) && [[ -z "${OTHERS}" ]]; then
            echo "::error::Every '${CTX}' signoff on ${SHA:0:7} is from the author (${AUTHOR}). One must come from someone else."
            echo "::error::A reviewer must pull this branch, run ./bin/ci, then ./bin/signoff ${SHA}"
            exit 1
          fi
          echo "Signed off locally by ${COUNT} people."

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The action comes from the commit that defines this workflow, the one
      # `v2` points at.
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          sparse-checkout: |
            actions
            local
          persist-credentials: false
      - uses: ./.ci-workflows/actions/check-branch-name
        with:
          branch: ${{ github.head_ref }}
