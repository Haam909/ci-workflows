# Haam909/ci-workflows/.github/workflows/reusable-verify-pull-request.yml
#
# Reusable PR gate. Two cheap checks, no toolchains, no matrix: the tests
# themselves ran on the developer's machine before the push (see LOCAL-GATE.md).
# Nothing here deploys or publishes.

name: verify-pull-request

on:
  workflow_call:
    inputs:
      require-local-signoff:
        description: >-
          Require a green local/ci commit status, posted by the developer's
          pre-push hook.
        type: boolean
        default: true
      signoff-context:
        type: string
        default: 'local/ci'

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The hook checked this before the push, but the base can move between a
      # push and a merge, so it is enforced here rather than just advised.
      - name: Branch must be current with its base
        env:
          BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "${BASE}"
          if ! git merge-base --is-ancestor "origin/${BASE}" HEAD; then
            BEHIND=$(git rev-list --count "HEAD..origin/${BASE}")
            echo "::error::${BASE} has moved on by ${BEHIND} commit(s). Rebase, re-run bin/ci, and push again."
            exit 1
          fi
          echo "Current with ${BASE}."

      # The developer machine ran the checks; this confirms it happened for
      # this exact commit. A new commit has no signoff.
      - name: Local checks must be signed off for this commit
        if: inputs.require-local-signoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CTX: ${{ inputs.signoff-context }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          STATE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses" \
                     --jq "[.[] | select(.context == \"${CTX}\")] | first | .state // empty")"
          if [[ "${STATE}" != "success" ]]; then
            echo "::error::No green '${CTX}' status on ${SHA:0:7} (found: ${STATE:-none})."
            echo "::error::Run ./bin/ci locally, then ./bin/signoff ${SHA}"
            exit 1
          fi
          echo "Signed off locally."

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: Haam909/ci-workflows/actions/check-branch-name@v1
        with:
          branch: ${{ github.head_ref }}
