# Haam909/ci-workflows/.github/workflows/reusable-release-to-production.yml
#
# Reusable, manual. The human decisions are which commit to ship (optional
# `sha` input; blank means the commit currently live in test), approving the
# `release` environment and, rarely, ticking the major box. There is no version
# input: the version is always derived.
#
# Ordering note: the GitHub Release is created as a draft with every asset
# attached, and the tag is pushed only after those uploads succeed. A failed
# upload therefore leaves no orphan tag behind. The draft is published only
# after every component has been promoted, so a public release always means
# it is live; a failed promote leaves the tag and a draft, and re-running the
# failed jobs finishes the release.

name: release-to-production

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        default: '.github/components.yml'
      major:
        type: boolean
        default: false
      sha:
        description: >-
          Commit to release. Any ancestor of the default branch newer than the
          last release.
          Blank releases the commit currently live in test.
        type: string
        default: ''
      node-version:
        type: string
        default: '22'
      dotnet-version:
        type: string
        default: '9.0.x'
      python-version:
        type: string
        default: '3.12'
      sign-private-to-public-log:
        description: >-
          Sign a private or internal repo's assets with cosign anyway. Keyless
          signing records the repo's name in Sigstore's public log.
        type: boolean
        default: false

# No permissions block: the token is whatever the trigger grants. Declaring a
# permission here that an existing trigger doesn't grant would stop that
# repo's runs at startup, so new ones (pull-requests: read) are added to the
# triggers in examples/ only.

jobs:
  resolve:
    name: resolve target and version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      components: ${{ steps.read.outputs.components }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the commit to release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          SHA=""; CREATED=""

          if [[ -n "${INPUT_SHA}" ]]; then
            # Chosen by a person. Sign-off happens outside CI, so the only
            # requirement is that it is on the default branch.
            SHA="$(git rev-parse --verify --quiet "${INPUT_SHA}^{commit}")" \
              || { echo "::error::${INPUT_SHA} is not a commit in this repository."; exit 1; }
            SOURCE="chosen"
          else
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=test&per_page=30" --jq '.[].id'); do
              state="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // empty')"
              if [[ "${state}" == "success" ]]; then
                SHA="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.sha')"
                CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.created_at')"
                break
              fi
            done
            [[ -n "${SHA}" ]] || { echo "::error::No successful deployment to test found. Pass a sha to release a specific commit."; exit 1; }
            SOURCE="live in test"
          fi

          git merge-base --is-ancestor "${SHA}" "origin/${DEFAULT}" \
            || { echo "::error::${SHA} is not an ancestor of ${DEFAULT}."; exit 1; }

          # Versions only move forward: the commit must contain the latest
          # release. A commit at or behind it would derive a version that
          # already exists; one on a branch that forked before it (and merged
          # after) would ship without that release's changes.
          LATEST="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "origin/${DEFAULT}" 2>/dev/null || true)"
          if [[ -n "${LATEST}" ]]; then
            if git merge-base --is-ancestor "${SHA}" "${LATEST}"; then
              echo "::error::${SHA:0:7} is already included in ${LATEST}. Choose a commit after it."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${LATEST}" "${SHA}"; then
              echo "::error::${SHA:0:7} does not contain ${LATEST}: it branched off before that release. Choose a commit on ${DEFAULT} after it."
              exit 1
            fi
          fi

          if [[ -n "${CREATED}" ]]; then
            AGE=$(( ( $(date +%s) - $(date -d "${CREATED}" +%s) ) / 86400 ))
            (( AGE > 14 )) && echo "::warning::The test deployment is ${AGE} days old. Confirm this is what you mean to ship."
          fi

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${SHA} (${SOURCE})"

      # The checkout above is the dispatch ref (the default branch's head). A chosen older
      # commit must be built from its own manifest, so read it from that commit.
      - id: read
        env:
          SHA: ${{ steps.target.outputs.sha }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          git show "${SHA}:${MANIFEST}" > "${RUNNER_TEMP}/components.yml" \
            || { echo "::error::${MANIFEST} does not exist at ${SHA:0:7}."; exit 1; }
          COMPONENTS="$(yq -o=json -I=0 '.components' "${RUNNER_TEMP}/components.yml")"
          echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"
          echo "Manifest at ${SHA:0:7}: ${COMPONENTS}"

      - id: version
        uses: Haam909/ci-workflows/actions/derive-version@v1
        with:
          sha: ${{ steps.target.outputs.sha }}
          force-major: ${{ inputs.major }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Release v${{ steps.version.outputs.version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.target.outputs.sha }}\` (${{ steps.target.outputs.source }}) |"
            echo "| Previous | ${{ steps.version.outputs.previous-tag }} |"
            echo "| Bump | ${{ steps.version.outputs.bump }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.component.name }}
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: release        # required reviewers here — this is the ship gate
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJSON(needs.resolve.outputs.components) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: Haam909/ci-workflows/actions/install-toolchain@v1
        with:
          component: ${{ toJSON(matrix.component) }}
          node-version: ${{ inputs.node-version }}
          dotnet-version: ${{ inputs.dotnet-version }}
          python-version: ${{ inputs.python-version }}

      - uses: azure/login@v2
        if: matrix.component.target == 'container'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: matrix.component.target == 'container'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      # Locked installs are what make this rebuild from the tested commit
      # resolve to the same dependencies, rather than checking afterwards.
      - id: build
        uses: Haam909/ci-workflows/actions/build-artifact@v1
        with:
          component: ${{ toJSON(matrix.component) }}
          version: ${{ needs.resolve.outputs.version }}
          registry: ${{ vars.ACR_NAME && format('{0}.azurecr.io', vars.ACR_NAME) || '' }}

      # ---------- SBOM: release deliverable, generated once, here ----------

      - name: SBOM
        uses: Haam909/ci-workflows/actions/generate-sbom@v1
        with:
          component: ${{ toJSON(matrix.component) }}
          version: ${{ needs.resolve.outputs.version }}

      # cosign's keyless signing writes the signing certificate, which names
      # this repo and workflow, to Sigstore's public transparency log. That is
      # fine for a public repo and a leak for a private one, so a private repo
      # signs only if it opts in. GitHub's attestation (next) covers it there.
      - uses: sigstore/cosign-installer@v3
        if: github.event.repository.visibility == 'public' || inputs.sign-private-to-public-log

      - name: Sign
        if: github.event.repository.visibility == 'public' || inputs.sign-private-to-public-log
        env:
          IMAGE: ${{ steps.build.outputs.artifact }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Containers are signed by digest in the registry; everything else
          # is signed as a blob with a detached bundle.
          if [[ "${{ matrix.component.target }}" == "container" ]]; then
            cosign sign --yes "${IMAGE}"
          fi
          for f in _artifacts/*.zip _artifacts/*.nupkg _artifacts/*.tgz _artifacts/*.whl _artifacts/*.tar.gz _artifacts/*.cdx.json; do
            cosign sign-blob --yes "$f" --bundle "${f}.cosign.bundle"
          done

      # Attestations work in public repos on every plan, and in private ones
      # only on GitHub Enterprise Cloud. A private repo elsewhere gets a
      # warning instead of a failed release.
      - uses: actions/attest-build-provenance@v2
        id: attest
        if: matrix.component.target != 'container'
        continue-on-error: ${{ github.event.repository.visibility != 'public' }}
        with:
          subject-path: |
            _artifacts/*.zip
            _artifacts/*.nupkg
            _artifacts/*.tgz
            _artifacts/*.whl

      - name: Note what wasn't signed
        if: steps.attest.outcome == 'failure' || (github.event.repository.visibility != 'public' && !inputs.sign-private-to-public-log)
        env:
          ATTEST: ${{ steps.attest.outcome }}
        run: |
          {
            echo "### ${{ matrix.component.name }}: provenance"
            [[ "${ATTEST}" == failure ]] && echo "- No attestation: GitHub offers them on private repos only with Enterprise Cloud."
            [[ "${{ github.event.repository.visibility }}" != public && "${{ inputs.sign-private-to-public-log }}" != true ]] \
              && echo "- No cosign bundles: this repo is ${{ github.event.repository.visibility }}, and they'd publish its name to Sigstore's public log (input sign-private-to-public-log)."
            echo "- SHA256SUMS in the release still covers every asset."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "${ATTEST}" == failure ]] && echo "::warning::${{ matrix.component.name }}: no attestation (private repo without Enterprise Cloud)" || true

      - name: Record image reference
        if: matrix.component.target == 'container'
        run: echo "${{ steps.build.outputs.artifact }}" > "_artifacts/${{ matrix.component.name }}.image"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.component.name }}
          path: _artifacts/
          retention-days: 90
          if-no-files-found: error

  publish:
    name: tag and draft release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: _artifacts

      - name: Checksums
        run: cd _artifacts && sha256sum * > SHA256SUMS

      - name: Create draft release with assets
        run: |
          gh release create "v${VERSION}" _artifacts/* \
            --target "${TARGET_SHA}" --title "v${VERSION}" \
            --generate-notes --draft

      - name: Push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" "${TARGET_SHA}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

  promote:
    name: promote ${{ matrix.component.name }}
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    # deployment: false stops GitHub recording this job against the commit the
    # run was dispatched from (the default branch's head), which isn't the commit being
    # shipped when a sha is chosen. The steps below record the real one.
    environment:
      name: production
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.resolve.outputs.components) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record deployment of the released commit
        id: record
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NAME: ${{ matrix.component.name }}
        run: |
          set -euo pipefail
          ID="$(jq -n --arg ref "${SHA}" --arg c "${NAME}" --arg v "${VERSION}" \
                  '{ref: $ref, environment: "production", production_environment: true,
                    auto_merge: false, required_contexts: [],
                    description: "\($c) v\($v)", payload: {component: $c, version: $v}}' \
                | gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" \
            -f state=in_progress -f log_url="${RUN_URL}" --silent
          echo "id=${ID}" >> "$GITHUB_OUTPUT"
          echo "Deployment ${ID}: ${NAME} v${VERSION} at ${SHA}"

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.component.name }}
          path: _artifacts

      - uses: actions/setup-node@v4
        if: matrix.component.target == 'package' && matrix.component.runtime == 'node'
        with:
          node-version: ${{ inputs.node-version }}

      - uses: actions/setup-dotnet@v4
        if: matrix.component.target == 'package' && matrix.component.runtime == 'dotnet'
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - uses: actions/setup-python@v5
        if: matrix.component.target == 'package' && matrix.component.runtime == 'python'
        with:
          python-version: ${{ inputs.python-version }}

      # Services always need Azure. Packages need it only when their feed is
      # Azure Artifacts, to mint the feed token.
      - uses: azure/login@v2
        if: matrix.component.target != 'package' || contains(matrix.component.feed || '', 'pkgs.dev.azure.com') || contains(matrix.component.feed || '', 'visualstudio.com')
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve artifact path
        id: artifact
        run: |
          set -euo pipefail
          case "${{ matrix.component.target }}" in
            container) echo "path=$(cat '_artifacts/${{ matrix.component.name }}.image')" >> "$GITHUB_OUTPUT" ;;
            package)
              case "${{ matrix.component.runtime }}" in
                dotnet) echo "path=$(ls _artifacts/*.nupkg | head -1)" >> "$GITHUB_OUTPUT" ;;
                node)   echo "path=$(ls _artifacts/*.tgz    | head -1)" >> "$GITHUB_OUTPUT" ;;
                python) echo "path=$(ls _artifacts/*.whl    | head -1)" >> "$GITHUB_OUTPUT" ;;
              esac ;;
            *) echo "path=_artifacts/${{ matrix.component.name }}-${{ needs.resolve.outputs.version }}.zip" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: Haam909/ci-workflows/actions/deliver-artifact@v1
        with:
          component: ${{ toJSON(matrix.component) }}
          artifact: ${{ steps.artifact.outputs.path }}
          version: ${{ needs.resolve.outputs.version }}
          stage: production
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          feed-token: ${{ matrix.component['feed-token-secret'] && secrets[matrix.component['feed-token-secret']] || '' }}

      - name: Record deployment result
        if: always() && steps.record.outputs.id != ''
        env:
          ID: ${{ steps.record.outputs.id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" \
            -f state="${STATE}" -f log_url="${RUN_URL}" --silent
          echo "Deployment ${ID}: ${STATE}"

  go-live:
    name: publish release
    needs: [resolve, promote]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish release
        run: gh release edit "v${{ needs.resolve.outputs.version }}" --draft=false -R "${GITHUB_REPOSITORY}"
