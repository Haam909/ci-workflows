# Haam909/ci-workflows/.github/workflows/reusable-deploy-to-test.yml
#
# Reusable. On merge to main, tests, builds and delivers every component to
# test. Delivery depends on target, not runtime:
#
#   app-service / function  ->  zip deploy to the test app
#   container               ->  image pushed to ACR, test Container App updated
#   package                 ->  prerelease published to the feed
#
# All of them run under `environment: test`, so a GitHub deployment record
# exists either way and reusable-release.yml can read it to find the commit to
# release. GitHub creates the environment on first use; it needs no rules.
#
# Versions here are prereleases (1.4.0-alpha.12). For packages that is the
# point: consumers can try the change. For services it is just a build label,
# and the release gets a clean version from reusable-release.yml.

name: deploy-to-test

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        default: '.github/components.yml'
      node-version:
        type: string
        default: '22'
      dotnet-version:
        type: string
        default: '9.0.x'
      python-version:
        type: string
        default: '3.12'

# No permissions block: the token is whatever the trigger grants. Declaring a
# permission here that an existing trigger doesn't grant would stop that
# repo's runs at startup, so new ones (pull-requests: read) are added to the
# triggers in examples/ only.

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.read.outputs.components }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        run: echo "components=$(yq -o=json -I=0 '.components' '${{ inputs.manifest }}')" >> "$GITHUB_OUTPUT"
      - id: version
        uses: Haam909/ci-workflows/actions/derive-version@v2
        with:
          sha: ${{ github.sha }}
          prerelease: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

  deliver:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: test
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    name: ${{ matrix.component.name }} -> test
    steps:
      - uses: actions/checkout@v4

      # Installing from Azure Artifacts takes an Entra token, so log in before
      # the install whenever the repo has an Azure identity at all; the repo's
      # own nuget.config, .npmrc or requirements files say whether the token
      # is then used. That needs no subscription. A separate step from the
      # login below: GitHub's OIDC token is short-lived, so the deploy and
      # publish log in again after the tests rather than reuse this one.
      - name: Azure login for package Feeds
        if: vars.AZURE_CLIENT_ID != ''
        # A failed login must not fail components that install from no Azure
        # Feed; install-toolchain errors itself for the ones that do.
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: Haam909/ci-workflows/actions/install-toolchain@v2
        with:
          component: ${{ toJSON(matrix.component) }}
          node-version: ${{ inputs.node-version }}
          dotnet-version: ${{ inputs.dotnet-version }}
          python-version: ${{ inputs.python-version }}

      # The developer machines ran these before the merge; this is the
      # backstop for two machines with the same stale SDK. A failing component
      # isn't deployed; the others still are (fail-fast is off).
      - uses: Haam909/ci-workflows/actions/run-tests@v2
        with:
          component: ${{ toJSON(matrix.component) }}
          manifest: ${{ inputs.manifest }}

      # Services always need Azure. Packages need it only when their feed is
      # Azure Artifacts, to mint the feed token; that needs no subscription,
      # so a repo whose only Azure use is Azure Artifacts sets none. A `none`
      # target is built and never delivered, so it needs nothing.
      - uses: azure/login@v2
        if: (matrix.component.target != 'package' && matrix.component.target != 'none') || contains(matrix.component.feed || '', 'pkgs.dev.azure.com') || contains(matrix.component.feed || '', 'visualstudio.com')
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ matrix.component.target == 'package' }}

      - name: Log in to ACR
        if: matrix.component.target == 'container'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - id: build
        uses: Haam909/ci-workflows/actions/build-artifact@v2
        with:
          component: ${{ toJSON(matrix.component) }}
          version: ${{ needs.discover.outputs.version }}
          registry: ${{ vars.ACR_NAME && format('{0}.azurecr.io', vars.ACR_NAME) || '' }}

      - uses: Haam909/ci-workflows/actions/deliver-artifact@v2
        with:
          component: ${{ toJSON(matrix.component) }}
          artifact: ${{ steps.build.outputs.artifact }}
          version: ${{ needs.discover.outputs.version }}
          stage: test
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          feed-token: ${{ matrix.component['feed-token-secret'] && secrets[matrix.component['feed-token-secret']] || '' }}

      - name: Summary
        run: |
          echo "- **${{ matrix.component.name }}** (${{ matrix.component.runtime }} → ${{ matrix.component.target }}) \`${{ needs.discover.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
