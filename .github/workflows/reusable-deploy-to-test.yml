# Haam909/ci-workflows/.github/workflows/reusable-deploy-to-test.yml
#
# Reusable. On merge to main, tests, builds and delivers every component to
# test. Delivery depends on target, not runtime:
#
#   app-service / function  ->  zip deploy to the test app
#   container               ->  image pushed to ACR, test Container App updated;
#                               without ACR_NAME, pushed to the Host's registry and no more
#   package                ->  prerelease published to the feed
#
# All of them run under `environment: test`, so a GitHub deployment record
# exists either way and reusable-release.yml can read it to find the commit to
# release. GitHub creates the environment on first use; it needs no rules.
#
# Versions here are prereleases (1.4.0-alpha.12). For packages that is the
# point: consumers can try the change. For services it is just a build label,
# and the release gets a clean version from reusable-release.yml.

name: deploy-to-test

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        default: '.github/components.yml'
      node-version:
        type: string
        default: '22'
      dotnet-version:
        type: string
        default: '9.0.x'
      python-version:
        type: string
        default: '3.12'

# No permissions block: the token is whatever the trigger grants. Declaring a
# permission here that an existing trigger doesn't grant would stop that
# repo's runs at startup, so new ones (pull-requests: read) are added to the
# triggers in examples/ only.

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.read.outputs.components }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A copy of ci-workflows that isn't public, which is every copy on a
      # GHE.com tenant, can't be read with this repo's GITHUB_TOKEN. The
      # release's GitHub App can, once it's installed on the copy too. If this
      # fails, the checkout falls back to GITHUB_TOKEN, enough for a public copy.
      - name: Token for the ci-workflows checkout
        id: ciw-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ job.workflow_repository }}
          permission-contents: read
      # The actions come from the commit that defines this workflow: the one
      # `v2` points at for a consumer, the commit under test in self-test.yml.
      # After the repo's own checkout, which would clean it away.
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          sparse-checkout: |
            actions
            local
          persist-credentials: false
          token: ${{ steps.ciw-token.outputs.token || github.token }}
      - id: read
        run: echo "components=$(yq -o=json -I=0 '.components' '${{ inputs.manifest }}')" >> "$GITHUB_OUTPUT"
      - id: version
        uses: ./.ci-workflows/actions/derive-version
        with:
          sha: ${{ github.sha }}
          prerelease: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

  deliver:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: test
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component: ${{ fromJSON(needs.discover.outputs.components) }}
    name: ${{ matrix.component.name }} -> test
    steps:
      - uses: actions/checkout@v4

      # A copy that isn't public needs the app's token (see discover).
      - name: Token for the ci-workflows checkout
        id: ciw-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ job.workflow_repository }}
          permission-contents: read

      # This workflow's actions, from its own commit (see discover).
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          sparse-checkout: |
            actions
            local
          persist-credentials: false
          token: ${{ steps.ciw-token.outputs.token || github.token }}

      # Installing from Azure Artifacts takes an Entra token, so log in before
      # the install whenever the repo has an Azure identity at all; the repo's
      # own nuget.config, .npmrc or requirements files say whether the token
      # is then used. That needs no subscription. A separate step from the
      # login below: GitHub's OIDC token is short-lived, so the deploy and
      # publish log in again after the tests rather than reuse this one.
      - name: Azure login for package Feeds
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: ./.ci-workflows/actions/install-toolchain
        with:
          component: ${{ toJSON(matrix.component) }}
          node-version: ${{ inputs.node-version }}
          dotnet-version: ${{ inputs.dotnet-version }}
          python-version: ${{ inputs.python-version }}

      # The developer machines ran these before the merge; this is the
      # backstop for two machines with the same stale SDK. A failing component
      # isn't deployed; the others still are (fail-fast is off).
      - uses: ./.ci-workflows/actions/run-tests
        with:
          component: ${{ toJSON(matrix.component) }}
          manifest: ${{ inputs.manifest }}

      # Services always need Azure. Packages need it only when their feed is
      # Azure Artifacts, to mint the feed token; that needs no subscription,
      # so a repo whose only Azure use is Azure Artifacts sets none. A `none`
      # target is built and never delivered, so it needs nothing, and nor
      # does a container without ACR_NAME: its image goes to the Host's
      # Container registry and nowhere else.
      - uses: azure/login@v2
        if: (matrix.component.target != 'package' && matrix.component.target != 'none' && (matrix.component.target != 'container' || vars.ACR_NAME != '')) || contains(matrix.component.feed || '', 'pkgs.dev.azure.com') || contains(matrix.component.feed || '', 'visualstudio.com')
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ matrix.component.target == 'package' }}

      - name: Log in to ACR
        if: matrix.component.target == 'container' && vars.ACR_NAME != ''
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - id: build
        uses: ./.ci-workflows/actions/build-artifact
        with:
          component: ${{ toJSON(matrix.component) }}
          version: ${{ needs.discover.outputs.version }}
          registry: ${{ vars.ACR_NAME && format('{0}.azurecr.io', vars.ACR_NAME) || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.ci-workflows/actions/deliver-artifact
        if: matrix.component.target != 'container' || vars.ACR_NAME != ''
        with:
          component: ${{ toJSON(matrix.component) }}
          artifact: ${{ steps.build.outputs.artifact }}
          version: ${{ needs.discover.outputs.version }}
          stage: test
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          feed-token: ${{ matrix.component['feed-token-secret'] && secrets[matrix.component['feed-token-secret']] || '' }}

      - name: Summary
        run: |
          echo "- **${{ matrix.component.name }}** (${{ matrix.component.runtime }} → ${{ matrix.component.target }}) \`${{ needs.discover.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
