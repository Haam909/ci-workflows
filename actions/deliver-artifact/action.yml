name: 'Deliver'
description: >-
  Delivers a built artifact to its target. Delivery depends only on target,
  not on runtime — a Python Function and a C# Function deploy identically.

inputs:
  component:
    required: true
  artifact:
    description: 'Path from the build action, or an image reference'
    required: true
  version:
    required: true
  stage:
    description: 'test | production'
    required: true
  resource-group:
    default: ''
  github-token:
    description: "GITHUB_TOKEN, used when the feed is GitHub Packages on the repo's Host"
    default: ''
  feed-token:
    description: >-
      Token for a feed that is neither GitHub Packages nor Azure Artifacts,
      from the secret named by the component's feed-token-secret.
    default: ''

runs:
  using: composite
  steps:
    # ---------- app-service ----------

    - name: App Service (test)
      if: fromJSON(inputs.component).target == 'app-service' && inputs.stage == 'test'
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ fromJSON(inputs.component).app-test }}
        package: ${{ inputs.artifact }}

    - name: App Service (staging slot)
      if: fromJSON(inputs.component).target == 'app-service' && inputs.stage == 'production'
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ fromJSON(inputs.component).app-prod }}
        slot-name: staging
        package: ${{ inputs.artifact }}

    # ---------- function ----------

    - name: Function App (test)
      if: fromJSON(inputs.component).target == 'function' && inputs.stage == 'test'
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ fromJSON(inputs.component).app-test }}
        package: ${{ inputs.artifact }}

    - name: Function App (staging slot)
      if: fromJSON(inputs.component).target == 'function' && inputs.stage == 'production'
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ fromJSON(inputs.component).app-prod }}
        slot-name: staging
        package: ${{ inputs.artifact }}

    # ---------- slot swap, health check, automatic rollback ----------

    - name: Promote slot
      if: (fromJSON(inputs.component).target == 'app-service' || fromJSON(inputs.component).target == 'function') && inputs.stage == 'production'
      shell: bash
      env:
        C: ${{ inputs.component }}
        RG: ${{ fromJSON(inputs.component).resource-group || inputs.resource-group }}
      run: |
        set -euo pipefail
        APP="$(jq -r '.["app-prod"]' <<< "$C")"
        HEALTH="$(jq -r '.["health-path"] // empty' <<< "$C")"

        poll() {
          local url="$1" tries="$2"
          for i in $(seq 1 "${tries}"); do
            if curl -fsS --max-time 10 "${url}" > /dev/null; then return 0; fi
            echo "  attempt ${i}/${tries} failed"; sleep 10
          done
          return 1
        }

        if [[ -n "${HEALTH}" ]]; then
          echo "Checking staging slot..."
          poll "https://${APP}-staging.azurewebsites.net${HEALTH}" 12 \
            || { echo "::error::Staging slot never became healthy — not swapping."; exit 1; }
        fi

        az webapp deployment slot swap -g "${RG}" -n "${APP}" \
          --slot staging --target-slot production

        if [[ -n "${HEALTH}" ]]; then
          echo "Verifying production..."
          if ! poll "https://${APP}.azurewebsites.net${HEALTH}" 6; then
            echo "::error::Production unhealthy after swap — rolling back."
            az webapp deployment slot swap -g "${RG}" -n "${APP}" \
              --slot staging --target-slot production
            exit 1
          fi
        fi
        echo "Promoted ${APP}."

    # ---------- container ----------

    - name: Container App
      if: fromJSON(inputs.component).target == 'container'
      shell: bash
      env:
        C: ${{ inputs.component }}
        IMAGE: ${{ inputs.artifact }}
        RG: ${{ fromJSON(inputs.component).resource-group || inputs.resource-group }}
        STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        if [[ "${STAGE}" == "test" ]]; then
          APP="$(jq -r '.["app-test"]' <<< "$C")"
        else
          APP="$(jq -r '.["app-prod"]' <<< "$C")"
        fi

        # A new revision is created and traffic moves to it. Rollback is
        # shifting traffic back to the previous revision, not a rebuild.
        az containerapp update -g "${RG}" -n "${APP}" --image "${IMAGE}"

        HEALTH="$(jq -r '.["health-path"] // empty' <<< "$C")"
        if [[ -n "${HEALTH}" ]]; then
          FQDN="$(az containerapp show -g "${RG}" -n "${APP}" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          for i in $(seq 1 12); do
            curl -fsS --max-time 10 "https://${FQDN}${HEALTH}" > /dev/null && break
            [[ "${i}" -eq 12 ]] && { echo "::error::${APP} unhealthy after update."; exit 1; }
            sleep 10
          done
        fi

    # ---------- package feeds ----------
    #
    # The feed is whatever the manifest says; it defaults to GitHub Packages
    # on the repo's own Host for NuGet and npm. That Host is read from the
    # runner, so a <tenant>.ghe.com repo gets nuget.<tenant>.ghe.com, not
    # nuget.pkg.github.com. Credentials are derived from the feed's host, so
    # no PAT is needed for GitHub Packages or Azure Artifacts.
    #
    # Feeds are immutable. A prerelease published from main is what consumers
    # try before a stable version exists; a bad stable release is fixed by
    # unlisting and shipping a patch, never by replacing the version.

    - name: Publish package
      if: fromJSON(inputs.component).target == 'package'
      shell: bash
      env:
        C: ${{ inputs.component }}
        ARTIFACT: ${{ inputs.artifact }}
        STAGE: ${{ inputs.stage }}
        GH_TOKEN_IN: ${{ inputs.github-token }}
        FEED_TOKEN_IN: ${{ inputs.feed-token }}
      run: |
        set -euo pipefail
        RUNTIME="$(jq -r '.runtime' <<< "$C")"
        FEED="$(jq -r '.feed // empty' <<< "$C")"

        # GitHub Packages on this Host: <registry>.pkg.github.com on
        # github.com, <registry>.<tenant>.ghe.com on a GHE.com tenant. Both
        # serve their API from api.<host>; on any other layout PKG stays
        # empty, so no feed is taken for this Host's GitHub Packages.
        HOST="${GITHUB_SERVER_URL#https://}"; HOST="${HOST%/}"
        PKG=""
        if [[ "${GITHUB_API_URL%/}" == "https://api.${HOST}" ]]; then
          if [[ "${HOST}" == github.com ]]; then PKG=pkg.github.com; else PKG="${HOST}"; fi
        fi

        # Default feed per runtime. GitHub Packages has no Python registry,
        # so a Python package must name its feed explicitly.
        if [[ -z "${FEED}" ]]; then
          if [[ "${RUNTIME}" != python && -z "${PKG}" ]]; then
            echo "::error::Can't tell where GitHub Packages is on this Host (server ${GITHUB_SERVER_URL}, API ${GITHUB_API_URL}) — set 'feed' on the component."
            exit 1
          fi
          case "${RUNTIME}" in
            dotnet) FEED="https://nuget.${PKG}/${GITHUB_REPOSITORY_OWNER}/index.json" ;;
            node)   FEED="https://npm.${PKG}" ;;
            python) echo "::error::Python packages need a 'feed' upload URL in the manifest."; exit 1 ;;
          esac
        fi

        FEED_HOST="${FEED#*://}"; FEED_HOST="${FEED_HOST%%/*}"; FEED_HOST="${FEED_HOST,,}"
        if [[ "${FEED_HOST}" == pkgs.dev.azure.com || "${FEED_HOST}" == *.visualstudio.com ]]; then
          # 499b84ac-... is the Azure DevOps resource ID. The token comes
          # from the same OIDC login as the Azure deploys, so no PAT.
          TOKEN="$(az account get-access-token \
                     --resource 499b84ac-1321-427f-aa17-267ca6975798 \
                     --query accessToken -o tsv)"
          echo "Feed: Azure Artifacts"
        elif [[ -n "${PKG}" && ( "${FEED_HOST}" == "nuget.${PKG}" || "${FEED_HOST}" == "npm.${PKG}" ) ]]; then
          TOKEN="${GH_TOKEN_IN}"
          echo "Feed: GitHub Packages"
        elif [[ -z "${FEED_TOKEN_IN}" ]]; then
          echo "::error::${FEED} is not GitHub Packages or Azure Artifacts — set 'feed-token-secret' on the component to the name of a secret holding its token."
          exit 1
        else
          TOKEN="${FEED_TOKEN_IN}"
          echo "Feed: custom (${FEED})"
        fi

        # A Deploy re-run (Re-run failed jobs, or the same tag dispatched
        # again) publishes versions already on the Feed. The Feed is
        # immutable, so on every runtime that is a warning and a skip, not a
        # failure. Any other publish failure still fails the step.
        # BEGIN publish-outcome
        # Prints published, duplicate or failed for a publish's exit code and
        # captured output. Only an error code or phrase that can mean nothing
        # but "this version is already there" counts, never a bare HTTP status.
        publish_outcome() {
          local runtime="$1" rc="$2" log="$3"
          case "${runtime}" in
            dotnet)
              # --skip-duplicate turns NuGet's 409 into exit 0 and logs it.
              if (( rc != 0 )); then echo failed
              elif grep -qiE 'already exists at feed|^[[:space:]]*Conflict https?://' "${log}"; then echo duplicate
              else echo published; fi ;;
            python)
              # No --skip-existing: Azure Artifacts refuses the flag before
              # uploading ("does not have support for the following features:
              # --skip-existing"), so the conflict is a failed upload, as on npm.
              # Known signatures:
              #   PyPI (warehouse): 400 "File already exists"
              #   Azure Artifacts:  phrasing for PyPI unrecorded; its npm text is
              #                     "already contains file ... in package"
              #   twine:            "... already exists" naming a file or version
              # twine uploads the wheel and the sdist together, so a partial
              # duplicate (one file new, one already there) is reported as a
              # duplicate; that is the known limit.
              if (( rc == 0 )); then echo published
              elif grep -qiE 'already contains file .* in package|file already exists|(file|version) [^[:space:]]+ already exists|version already exists|because it appears to already exist' "${log}"; then echo duplicate
              else echo failed; fi ;;
            node)
              # npm has no skip option, so the conflict is a failed publish.
              # Known signatures:
              #   npm:             code EPUBLISHCONFLICT, code E409,
              #                    "cannot publish over the previously published versions"
              #   GitHub Packages: code E409 + "Cannot publish over existing version"
              #   Azure Artifacts: code E403 + "already contains file ... in package"
              if (( rc == 0 )); then echo published
              elif grep -qiE 'EPUBLISHCONFLICT|\bE409\b|cannot publish over (the )?(previously published|existing) version|version [^[:space:]]+ already exists|version already exists|already contains file .* in package' "${log}"; then echo duplicate
              else echo failed; fi ;;
            *) if (( rc == 0 )); then echo published; else echo failed; fi ;;
          esac
        }
        # "<name> <version>" as the Feed knows them, read from the artifact.
        pkg_id() {
          local file="$1" runtime="$2" n v
          case "${runtime}" in
            dotnet)
              # The nuspec's own <id> and <version> elements; dependencies
              # carry theirs as attributes, so they never match.
              unzip -p "${file}" '*.nuspec' \
                | sed -n -e 's:.*<id>\(.*\)</id>.*:\1:p' -e 's:.*<version>\(.*\)</version>.*:\1:p' \
                | head -2 | paste -sd ' ' ;;
            node)
              tar -xzOf "${file}" package/package.json | jq -r '"\(.name) \(.version)"' ;;
            python)
              # <name>-<version>-<tags>.whl; a wheel name never holds a dash.
              IFS=- read -r n v _ <<< "$(basename "${file}")"; echo "${n} ${v}" ;;
          esac
        }
        # END publish-outcome

        LOG="${RUNNER_TEMP}/publish.log"
        RC=0
        case "${RUNTIME}" in
          dotnet)
            dotnet nuget add source "${FEED}" --name target \
              --username ci --password "${TOKEN}" --store-password-in-clear-text
            dotnet nuget push "${ARTIFACT}" --source target \
              --api-key "${TOKEN}" --skip-duplicate 2>&1 | tee "${LOG}" || RC=$?
            ;;
          node)
            TAG=latest
            [[ "${STAGE}" == "test" ]] && TAG=alpha
            # npm looks up credentials by the registry URL with a trailing
            # slash, so "//npm.pkg.github.com:_authToken" is never matched.
            REGISTRY="${FEED%/}/"
            # Written outside the repo so no token lands in the work tree,
            # and removed on every exit, failed publish included.
            NPMRC="${RUNNER_TEMP}/publish.npmrc"
            trap 'rm -f "${NPMRC}"' EXIT
            {
              printf 'registry=%s\n' "${REGISTRY}"
              printf '%s:_authToken=%s\n' "${REGISTRY#https:}" "${TOKEN}"
              printf 'always-auth=true\n'
            } > "${NPMRC}"
            # A relative "dir/file.tgz" reads to npm as a GitHub owner/repo
            # spec, so always hand it an absolute path.
            npm_config_userconfig="${NPMRC}" \
              npm publish "$(realpath "${ARTIFACT}")" --tag "${TAG}" --registry "${REGISTRY}" \
              2>&1 | tee "${LOG}" || RC=$?
            rm -f "${NPMRC}"
            ;;
          python)
            pip install --quiet twine
            shopt -s nullglob
            DIST="$(dirname "${ARTIFACT}")"
            # Only the wheel and sdist — the release folder also holds SBOMs
            # and signature bundles, which twine would reject.
            FILES=( "${DIST}"/*.whl "${DIST}"/*.tar.gz )
            if (( ${#FILES[@]} == 0 )); then
              echo "::error::No wheel or sdist found in ${DIST}"; exit 1
            fi
            TWINE_USERNAME=ci TWINE_PASSWORD="${TOKEN}" \
              twine upload --repository-url "${FEED}" "${FILES[@]}" \
              2>&1 | tee "${LOG}" || RC=$?
            ;;
        esac

        case "$(publish_outcome "${RUNTIME}" "${RC}" "${LOG}")" in
          duplicate)
            ID="$(pkg_id "${ARTIFACT}" "${RUNTIME}")" || ID=""
            [[ -n "${ID// /}" ]] || ID="$(basename "${ARTIFACT}")"
            echo "::warning::${ID} is already on ${FEED_HOST}; not published again"
            ;;
          failed)
            exit "${RC}"
            ;;
        esac
