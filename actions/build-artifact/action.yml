name: 'Build artifact'
description: >-
  Builds a component, stamps it with the version, and produces what its
  target needs: a zip (app-service, function), a package file (package), or
  a pushed image (container).

inputs:
  component:
    required: true
  version:
    required: true
  registry:
    description: >-
      ACR login server, e.g. contoso.azurecr.io (container target). Blank
      pushes to the Host's Container registry, logged in with github-token:
      ghcr.io/<owner>/<repo> on github.com,
      containers.<tenant>.ghe.com/<owner>/<repo> on a GHE.com tenant.
    default: ''
  github-token:
    description: "GITHUB_TOKEN, used when a container goes to the Host's Container registry"
    default: ''

outputs:
  artifact:
    description: 'Path to the produced file, or the image reference for containers'
    value: ${{ steps.build.outputs.artifact }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        C: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
        GH_TOKEN_IN: ${{ inputs.github-token }}
        STAMP_PY: ${{ github.action_path }}/stamp-python-version.py
      run: |
        set -euo pipefail

        NAME="$(jq -r '.name' <<< "$C")"
        RUNTIME="$(jq -r '.runtime' <<< "$C")"
        TARGET="$(jq -r '.target' <<< "$C")"
        DIR="$(jq -r '.path // "."' <<< "$C")"
        PROJECT="$(jq -r '.project // empty' <<< "$C")"

        # Kept apart from the component's own tree: a node component at the
        # repo root builds into ./dist, which must not collide with ours.
        OUT="${GITHUB_WORKSPACE}/_artifacts"
        STAGE="${RUNNER_TEMP}/stage/${NAME}"
        mkdir -p "${OUT}" "${STAGE}"

        # .ci-workflows is where the reusable workflows check out their actions.
        copy_tree() {
          tar -C "$1" \
            --exclude=./.git --exclude=./node_modules --exclude=./_artifacts \
            --exclude=./.ci-workflows \
            --exclude=./.venv --exclude=./venv --exclude='__pycache__' \
            -cf - . | tar -C "${STAGE}" -xf -
        }

        # ---------- stamp the version ----------
        case "${RUNTIME}" in
          node)
            (cd "${DIR}" && npm version "${VERSION}" --no-git-tag-version --allow-same-version)
            ;;
          python)
            # PEP 440 spells the prerelease 1.4.0a12, not 1.4.0-alpha.12.
            PY_VERSION="$(sed -E 's/-alpha\.([0-9]+)$/a\1/' <<< "${VERSION}")"
            export SETUPTOOLS_SCM_PRETEND_VERSION="${PY_VERSION}"
            if [[ -f "${DIR}/pyproject.toml" ]]; then
              python3 "${STAMP_PY}" "${DIR}/pyproject.toml" "${PY_VERSION}"
            fi
            ;;
        esac

        # ---------- container: same path for every runtime ----------
        if [[ "${TARGET}" == "container" ]]; then
          # No ACR: the Host's own Container registry, ghcr.io on github.com
          # and containers.<tenant>.ghe.com on a GHE.com tenant ("replace
          # "ghcr.io" with https://containers.SUBDOMAIN.ghe.com", GitHub Docs,
          # Working with the Container registry). Its names must be lowercase,
          # and carry the repo so two of the owner's repos with a component of
          # the same name don't meet.
          if [[ -z "${REGISTRY}" ]]; then
            HOST="${GITHUB_SERVER_URL#https://}"; HOST="${HOST%/}"
            case "${HOST}" in
              github.com) CR=ghcr.io ;;
              *.ghe.com)  CR="containers.${HOST}" ;;
              *) echo "::error::container target needs a registry: set ACR_NAME (no Container registry is known for ${HOST})"; exit 1 ;;
            esac
            [[ -n "${GH_TOKEN_IN}" ]] \
              || { echo "::error::container target needs a registry, or github-token for ${CR}"; exit 1; }
            REGISTRY="${CR}/${GITHUB_REPOSITORY,,}"
            echo "${GH_TOKEN_IN}" | docker login "${CR}" -u "${GITHUB_ACTOR}" --password-stdin
          fi
          IMAGE="${REGISTRY}/${NAME}:${VERSION}"
          docker build \
            --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f "$(jq -r '.dockerfile // "Dockerfile"' <<< "$C")" \
            -t "${IMAGE}" "${DIR}"
          docker push "${IMAGE}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}")"
          echo "artifact=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${DIGEST}"
          exit 0
        fi

        # ---------- package ----------
        if [[ "${TARGET}" == "package" ]]; then
          case "${RUNTIME}" in
            dotnet)
              dotnet pack "${PROJECT}" -c Release --no-restore -o "${OUT}" -p:Version="${VERSION}"
              echo "artifact=$(ls "${OUT}"/*.nupkg | head -1)" >> "$GITHUB_OUTPUT"
              ;;
            node)
              (cd "${DIR}" && npm run build --if-present && npm pack --pack-destination "${OUT}")
              echo "artifact=$(ls "${OUT}"/*.tgz | head -1)" >> "$GITHUB_OUTPUT"
              ;;
            python)
              pip install --quiet build
              (cd "${DIR}" && python -m build --outdir "${OUT}")
              echo "artifact=$(ls "${OUT}"/*.whl | head -1)" >> "$GITHUB_OUTPUT"
              ;;
          esac
          exit 0
        fi

        # ---------- app-service / function ----------
        case "${RUNTIME}" in
          dotnet)
            dotnet publish "${PROJECT}" -c Release --no-restore \
              -o "${STAGE}" -p:Version="${VERSION}"
            ;;
          node)
            # Node on App Service and Functions starts from package.json, so
            # ship the built tree plus production node_modules — the compiled
            # output alone won't start.
            (cd "${DIR}" && npm run build --if-present)
            copy_tree "${DIR}"
            (cd "${STAGE}" && npm ci --omit=dev)
            ;;
          python)
            copy_tree "${DIR}"
            if [[ "${TARGET}" == "function" ]]; then
              # Functions load dependencies from .python_packages.
              SITE="${STAGE}/.python_packages/lib/site-packages"
              if [[ -f "${STAGE}/requirements.lock.txt" ]]; then
                pip install --require-hashes --target="${SITE}" -r "${STAGE}/requirements.lock.txt"
              elif [[ -f "${STAGE}/requirements.txt" ]]; then
                pip install --target="${SITE}" -r "${STAGE}/requirements.txt"
              else
                pip install --target="${SITE}" "${STAGE}"
              fi
            else
              # App Service installs requirements.txt itself (Oryx), and does
              # not read .python_packages. Hand it the hash-pinned lock so
              # that install is deterministic.
              if [[ -f "${STAGE}/requirements.lock.txt" ]]; then
                cp "${STAGE}/requirements.lock.txt" "${STAGE}/requirements.txt"
              fi
              if [[ ! -f "${STAGE}/requirements.txt" ]]; then
                echo "::error::Python on App Service needs requirements.txt or requirements.lock.txt"
                exit 1
              fi
            fi
            ;;
        esac

        ZIP="${OUT}/${NAME}-${VERSION}.zip"
        (cd "${STAGE}" && zip -qr "${ZIP}" . -x '*.pyc')
        echo "artifact=${ZIP}" >> "$GITHUB_OUTPUT"
        echo "Built ${ZIP}"
