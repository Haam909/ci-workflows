name: 'Generate SBOM'
description: >-
  Writes a CycloneDX SBOM for a component to
  _artifacts/<name>-<version>.cdx.json. Runs after build-artifact, which has
  already stamped the version into package.json / pyproject.toml.

inputs:
  component:
    description: 'Component object as JSON'
    required: true
  version:
    required: true

outputs:
  sbom:
    description: 'Path to the SBOM'
    value: ${{ steps.sbom.outputs.sbom }}

runs:
  using: composite
  steps:
    - id: sbom
      shell: bash
      working-directory: ${{ fromJSON(inputs.component).path || '.' }}
      env:
        C: ${{ inputs.component }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        NAME="$(jq -r '.name' <<< "$C")"
        OUT="${GITHUB_WORKSPACE}/_artifacts/${NAME}-${VERSION}.cdx.json"
        mkdir -p "${GITHUB_WORKSPACE}/_artifacts"
        case "$(jq -r '.runtime' <<< "$C")" in
          node)
            npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "${OUT}" ;;
          python)
            pip install --quiet cyclonedx-bom
            if [[ -f requirements.lock.txt ]]; then
              cyclonedx-py requirements requirements.lock.txt -o "${OUT}" --output-format JSON
            elif [[ -f requirements.txt ]]; then
              cyclonedx-py requirements requirements.txt -o "${OUT}" --output-format JSON
            else
              cyclonedx-py environment -o "${OUT}" --output-format JSON
            fi ;;
          dotnet)
            # Without --set-version the BOM names the component 0.0.0.
            dotnet tool install --global CycloneDX
            dotnet CycloneDX "$(jq -r '.project' <<< "$C")" \
              --output "${GITHUB_WORKSPACE}/_artifacts" \
              --filename "${NAME}-${VERSION}.cdx.json" --json ;;
        esac
        echo "sbom=${OUT}" >> "$GITHUB_OUTPUT"
